[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellbench"
version = "0.0.1"
description = "Whole-building embodied-carbon savings of thin-shell floors in code-designed RC frames in seismic zones."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Nafiz Reja Hasib" }]
keywords = ["embodied carbon", "thin-shell floor", "reinforced concrete", "seismic design", "structural engineering"]
# Dependencies are pinned in environment.yml (conda env "research").
dependencies = []

[project.urls]
Repository = "https://github.com/syednafizreja/ShellBench"
Issues = "https://github.com/syednafizreja/ShellBench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
