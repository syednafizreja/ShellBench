# Run the pytest suite on every push and pull request.
# The tests need pytest, OpenSeesPy (anchor frame, from Day 5) and the package
# itself, so this installs those rather than the full conda environment
# (gmsh). CalculiX comes from Ubuntu's package (2.21; environment.yml pins
# 2.23 from conda-forge) so the Day 22 smoke test runs here too.
# Versions match environment.yml otherwise.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CalculiX
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 openseespy==3.8.0.0 matplotlib==3.11.2
          python -m pip install -e .

      - name: Run tests
        run: pytest -v
